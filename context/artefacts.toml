# Artefact registry — machine authority.
#
# Read by bin/lint-artefacts. The prose companion (purpose per kind, templates)
# is artefacts.md. This file is the single source of truth for classes, their
# status machines, the kind -> class / home / naming mapping, and the engagement
# register. The prose file references it and never embeds a copy.
#
# Layout rule (topic-first): standing and binding kinds sit directly in their
# home under uppercase names; episodic and ephemeral kinds live one topic
# directory below theirs as <kind>-<slug>.md. The lint derives this from the
# class, so it is not repeated per kind.
#
# Non-entity directories: a topic may hold the subdirectories declared below
# beside its artefacts. They are not artefacts — they carry no kind and no
# status — and the no-subdirectory rule binds model *entities*, whose address is
# their filename. Only tracked ones are enforceable; tmp/ is gitignored and never
# appears in a tracked path. Nesting inside a non-entity directory is
# unconstrained.
#
# The engagement register below ships empty. Add an [engagements.<name>] entry
# the first time you open an engagement directory under context/engagements/.

[subdirectory.attachments]
tracked = true
purpose = "derivation input — source material an artefact is derived from; graduates like an ephemeral"

[subdirectory.tmp]
tracked = false
purpose = "working scratch, untracked"

[class.standing]
statuses = ["live", "retired"]

[class.binding]
statuses = ["active", "superseded"]

[class.episodic]
statuses = ["open", "closed", "compacted"]

[class.ephemeral]
statuses = ["open", "graduated", "expired"]

[kind.state]
class = "standing"
home = "context"
naming = "STATE.md (singleton)"

[kind.doctrine]
class = "standing"
home = "context"
naming = "<TOPIC>.md (uppercase; multiword topics separated by underscore, e.g. PRODUCT_ROADMAP.md)"

[kind.decision]
class = "binding"
home = "context"
naming = "DECISIONS.md (single append-only register; entries numbered, never renumbered)"

[kind.spec]
class = "episodic"
home = "context/engagements"
naming = "<engagement>/spec-<slug>.md"

[kind.plan]
class = "episodic"
home = "context/engagements"
naming = "<engagement>/plan-<slug>.md"

[kind.ledger]
class = "episodic"
home = "context/engagements"
naming = "<engagement>/ledger-<slug>.md"

[kind.handover]
class = "ephemeral"
home = "context/engagements"
naming = "<engagement>/handover-NN-<slug>.md"

[kind.report]
class = "ephemeral"
home = "context/engagements"
naming = "<engagement>/report-NN-<slug>.md"

[kind.probe]
class = "ephemeral"
home = "context/engagements"
naming = "<engagement>/probe-<slug>.md"

# The STATE.md shape's numbers. Every key is optional; the lint supplies these
# same values as defaults when one is absent. A grown workspace raises its caps
# here, in one reviewable line, instead of amending the lint.
#
# An engagement may declare activity = "active" | "dormant" (default active).
# Dormant means nothing is in flight to resume and nothing is queued that a
# session could start without a new trigger; it moves the engagement's
# STATE.md presence from a full item to one roll-up line.
[state]
max_items = 12
field_tokens = 50
rollup_tokens = 25
next_entries = 8
stale_days = 30

# Engagement register — empty on a fresh workspace. One entry per engagement:
#
# [engagements.<name>]
# status = "open"      # open | closed | compacted
# activity = "active"  # active | dormant, optional, default active
# depends-on = []      # names of engagements this one depends on
# remits = []          # standing areas of responsibility this work counts
#                      # against; required; [] means "none, deliberately"
