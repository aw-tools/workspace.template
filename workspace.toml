# Workspace manifest — the single source of truth for `aw`.
#
# Edit this file, then run `bin/bootstrap`.

[workspace]
name = "CHANGEME"

# Repo-local git identity applied by `aw` to the workspace repo and every
# managed inner repo. Portable to any machine or runner.
#
# [identity]
# name = ""
# email = ""
# signingkey = ""
# gpgsign = true

# Inner repositories.
#
#   path   — checkout location, relative to the workspace root
#   url    — clone URL
#   branch — optional; omit to use the remote's default branch
#   skills — optional; opt this repo into skill propagation.
#            `true` links every skill the repo exposes; a list links only the
#            named ones. Default: off — skills are never loaded from a repo
#            that has not opted in.
#
# [[repo]]
# path = "service-api"
# url = "git@github.com:example/service-api.git"
# branch = "main"
#
# [[repo]]
# path = "service-web"
# url = "git@github.com:example/service-web.git"
# skills = true
#
# [[repo]]
# path = "../skills"
# url = "git@github.com:example/skills.git"
# skills = ["code-review", "release"]
