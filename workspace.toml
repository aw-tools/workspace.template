# Workspace manifest — the single source of truth for `aw`.
#
# Edit this file, then run `aw bootstrap`.

[workspace]
name = "CHANGEME"

# Repo-local git identity applied by `aw` to the workspace repo and every
# managed inner repo. Portable to any machine or runner.
#
# [identity]
# name = ""
# email = ""
# signingkey = ""
# gpgsign = true

# Inner repositories.
#
#   path         — checkout location, relative to the workspace root. Must be
#                  inside the workspace: `..` and absolute paths are rejected.
#   url          — clone URL
#   branch       — optional; omit to use the remote's default branch
#   skills       — optional; opt this repo into skill propagation. `true` (or
#                  an empty table `{}`) opts in with the convention source
#                  directories `.agents/skills` then `.claude/skills`; a table
#                  narrows it: `dirs` names the source directories relative to
#                  the checkout, `only` allowlists skill names. `false` is the
#                  same as absent. Default: off — skills are never loaded from
#                  a repo that has not opted in. Unknown keys are rejected.
#
# Precedence: workspace-local `.skills/` first, then member repos in the order
# listed below; within a repo, source directories in listed order. First claim
# wins; every loser is reported, never silently dropped or renamed. A configured
# `dirs` entry that does not exist warns in bootstrap/sync/doctor; absent
# convention directories stay silent.
#
# [[repo]]
# path = "service-api"
# url = "git@github.com:example/service-api.git"
# branch = "main"
#
# [[repo]]
# path = "service-web"
# url = "git@github.com:example/service-web.git"
# skills = true
#
# A dedicated skills repository keeps its corpus under one directory.
#
# [[repo]]
# path = "skills"
# url = "git@github.com:example/skills.git"
# skills = { dirs = ["src"], only = ["code-review", "release"] }
